# marcadores de posición:
#  %tier%
#  %buy-price%$
#  %speed%
#  %drop-name%
#  %drop-material%
#  %drop-name-<number>%
#  %drop-material-<number>%
#  %drop-chance-<number>%
#  %sell-price%
#  %sell-price-<number%
#  %upgrade-price%
#  %repair-cost%
#
# solo para hologramas:
#  %next-spawn%/%spawn-time%

# opciones del constructor de artículos: (todas son opcionales)
#
# nota: para usar el id de bloque personalizado DEBES tener Oraxen o ItemsAdder
#
# item:
#  material: LEATHER_HELMET
#  custom-block-id: "mi_bloque"
#  color: "255, 50, 50"
#  name: "<red>Ejemplo"
#  lore:
#    - "&7múltiples líneas"
#    - "&#FF3333lore"
#  glow: true
#  custom-model-data: 100
#  enchantments:
#    sharpness: 1

# puedes agregar tantos niveles como quieras
